<aside class="sidebar">
    <a href="{{ site.baseurl }}/" class="logo-link" aria-label="Página Inicial">
        <div class="logo">
            <img src="{{ '/assets/player-logo.png' | relative_url }}" alt="AlgoPlayer Logo" class="site-logo">
        </div>
    </a>
    <div class="playlist-container">
        <h2>Módulos & Aulas</h2>
        <ul class="playlist">
            {% for module in site.data.course_structure.modules %}
            <li class="playlist-module">
                <span class="module-title">
                    {{ module.emoji }}
                    {{ module.title }}
                </span>
                <ul class="module-lessons">
                    {% for lesson in module.lessons %}
                    {% if lesson.mp3_path or lesson.md_path %}
                    <li class="lesson" data-lesson-id="{{ lesson.id }}"
                        data-audio-src="{{ lesson.mp3_path | prepend: site.baseurl }}"
                        data-md-path="{{ lesson.md_path | prepend: site.baseurl }}"
                        data-lesson-title="{{ lesson.title | escape }}" data-module-title="{{ module.title | escape }}">
                        <a href="#{{ lesson.id }}" class="lesson-link" draggable="false">
                            <div class="play-icon"><i class="fas fa-play"></i></div>
                            <div class="lesson-info">
                                <span class="lesson-title">{{ lesson.title }}</span>
                                <span class="lesson-module">{{ module.title }}</span>
                            </div>
                        </a>
                    </li>
                    {% endif %}
                    {% endfor %}
                </ul>
            </li>
            {% endfor %}
        </ul>
    </div>
</aside>
